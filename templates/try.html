<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Clock</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #000010, #000);
        font-family: "Orbitron", sans-serif;
        overflow: hidden;
        color: #00fff2;
    }
    .clock {
        position: relative;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        border: 3px solid rgba(0,255,242,0.3);
        box-shadow: 0 0 40px rgba(0,255,242,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .digital {
        position: absolute;
        bottom: 40px;
        font-size: 2em;
        letter-spacing: 3px;
        text-shadow: 0 0 15px #00fff2;
    }
    .hand {
        position: absolute;
        background: #00fff2;
        transform-origin: bottom center;
        border-radius: 10px;
    }
    .hour {
        width: 6px;
        height: 100px;
        bottom: 50%;
        background: #00fff2;
        box-shadow: 0 0 15px #00fff2;
    }
    .minute {
        width: 4px;
        height: 130px;
        bottom: 50%;
        background: #00b8ff;
        box-shadow: 0 0 10px #00b8ff;
    }
    .second {
        width: 2px;
        height: 150px;
        bottom: 50%;
        background: #ff0077;
        box-shadow: 0 0 15px #ff0077;
    }
    .center-dot {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 10px #fff;
        z-index: 10;
    }
    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 20px #00fff2; }
        50% { box-shadow: 0 0 60px #00fff2; }
    }
    .clock {
        animation: pulse 3s infinite ease-in-out;
    }
</style>
</head>
<body>

<div class="clock">
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
    <div class="center-dot"></div>
    <div class="digital" id="digital"></div>
</div>

<script>
function updateClock() {
    const now = new Date();
    const hr = now.getHours();
    const min = now.getMinutes();
    const sec = now.getSeconds();

    const hourDeg = (hr % 12) * 30 + (min / 2);
    const minuteDeg = min * 6;
    const secondDeg = sec * 6;

    document.getElementById("hour").style.transform = rotate(`${hourDeg}deg`);
    document.getElementById("minute").style.transform = rotate(`${minuteDeg}deg`);
    document.getElementById("second").style.transform = rotate(`${secondDeg}deg`);

    // Digital clock
    const pad = n => n.toString().padStart(2, "0");
    const digitalTime = `${pad(hr)}:${pad(min)}:${pad(sec)}`;
    document.getElementById("digital").textContent = digitalTime;

    // Smooth color pulse
    const hue = (sec * 6 + min * 0.5) % 360;
    document.body.style.background = `radial-gradient(circle at center, hsl(${hue}, 100%, 10%), hsl(${(hue + 60) % 360}, 100%, 5%))`;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
