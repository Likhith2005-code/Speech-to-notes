<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultra Flying Bird – Fully Customisable</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#70c5ce;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;touch-action:none;font-family:Arial,sans-serif}
    #gameContainer{position:relative;width:100%;max-width:400px;aspect-ratio:9/16;box-shadow:0 0 20px rgba(0,0,0,.4)}
    canvas{width:100%;height:100%;display:block;background:#70c5ce;touch-action:none}
    #muteBtn{position:absolute;top:10px;right:10px;padding:8px 14px;background:rgba(255,255,255,.9);border:2px solid #000;border-radius:10px;font-weight:bold;cursor:pointer;user-select:none;z-index:10;transition:all .2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
    #muteBtn:active{transform:scale(.95);background:#fff}
    .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);animation:ripple .6s linear;pointer-events:none}
    @keyframes ripple{to{transform:scale(4);opacity:0}}
</style>
</head>
<body>
<div id="gameContainer">
    <button id="muteBtn">Mute</button>
    <canvas id="canvas"></canvas>
</div>

<script>
/* -------------------------------------------------
   ====  USER‑REPLACEABLE ASSETS  ====
   Change the URLs (or local paths) below to use your own images / sounds.
   ------------------------------------------------- */
const ASSETS = {
    // Bird (34×24 recommended)
    bird: 'https://via.placeholder.com/34x24?text=Bird',

    // Background image (covers whole canvas)
    background: 'https://images.unsplash.com/photo-1506318137071-a8e063b4ca58?auto=format&fit=crop&w=800&q=80',

    // Pipe (obstacle) – two images: top pipe & bottom pipe (52×320 each is fine)
    pipeTop:    'https://i.imgur.com/7qY5J9K.png',   // top part
    pipeBottom: 'https://i.imgur.com/7qY5J9K.png',   // bottom part (same image works)

    // Sounds – replace with your own .mp3 / .wav files
    flap:  'https://cdn.freesound.org/previews/657/657773_5674468-lq.mp3',
    score: 'https://cdn.freesound.org/previews/269/269699_5674468-lq.mp3',
    hit:   'https://cdn.freesound.org/previews/399/399036_5674468-lq.mp3',
    die:   'https://cdn.freesound.org/previews/269/269026_5674468-lq.mp3',
    bgm:   'https://cdn.freesound.org/previews/657/657573_5674468-lq.mp3'   // looping background music
};
/* ------------------------------------------------- */

/* ---------- Canvas & Scaling ---------- */
const container = document.getElementById('gameContainer');
const canvas    = document.getElementById('canvas');
const ctx       = canvas.getContext('2d');

const GAME_W = 288, GAME_H = 512;
let scale = 1;

function resize() {
    const rect = container.getBoundingClientRect();
    scale = rect.width / GAME_W;
    canvas.width = GAME_W; canvas.height = GAME_H;
    ctx.setTransform(scale,0,0,scale,0,0);
}
resize(); window.addEventListener('resize', resize);

/* ---------- Audio ---------- */
let muted = false;
const muteBtn = document.getElementById('muteBtn');
muteBtn.onclick = () => {
    muted = !muted;
    muteBtn.textContent = muted ? 'Unmute' : 'Mute';
    if (!muted && bgAudio) bgAudio.play().catch(()=>{});
};

function play(key){ if(muted) return; const a=new Audio(ASSETS[key]); a.volume=key==='bgm'?0.3:0.6; a.play().catch(()=>{}); return a; }
let bgAudio = null;
function startBGM(){ if(muted||bgAudio) return; bgAudio=new Audio(ASSETS.bgm); bgAudio.loop=true; bgAudio.volume=0.3; bgAudio.play().catch(()=>{}); }

/* ---------- Asset Loading ---------- */
const img = {};
function loadImage(key, src){ img[key]=new Image(); img[key].src=src; }

loadImage('pidk.jpg', ASSETS.bird);
loadImage('bg',   ASSETS.background);
loadImage('pipeTop',    ASSETS.pipeTop);
loadImage('pipeBottom', ASSETS.pipeBottom);

/* ---------- Game State ---------- */
let bird = {x:60,y:150,w:34,h:24,vy:0,gravity:0.6,lift:-14};
let pipes = [], score=0, frame=0, over=false;
const PIPE_W = 52, PIPE_GAP = 120, GROUND_H = 112;

/* ---------- Drawing ---------- */
function drawBg(){
    if(img.bg.complete) ctx.drawImage(img.bg,0,0,GAME_W,GAME_H);
    else { ctx.fillStyle='#70c5ce'; ctx.fillRect(0,0,GAME_W,GAME_H); }

    // ground
    ctx.fillStyle='#ded895';
    ctx.fillRect(0,GAME_H-GROUND_H,GAME_W,GROUND_H);
}
function drawBird(){
    ctx.save();
    ctx.translate(bird.x+bird.w/2, bird.y+bird.h/2);
    const angle = Math.min(Math.max(bird.vy*3,-45),45)*(Math.PI/180);
    ctx.rotate(angle);
    ctx.drawImage(img.bird, -bird.w/2, -bird.h/2, bird.w, bird.h);
    ctx.restore();
}
function drawPipes(){
    pipes.forEach(p=>{
        // top
        ctx.drawImage(img.pipeTop, p.x, 0, PIPE_W, p.top);
        // bottom
        ctx.drawImage(img.pipeBottom, p.x, p.top+PIPE_GAP, PIPE_W, GAME_H-GROUND_H-(p.top+PIPE_GAP));
    });
}
function drawScore(){
    ctx.font='24px Arial';
    ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.strokeText(`Score: ${score}`,12,32);
    ctx.fillStyle='#fff';
    ctx.fillText(`Score: ${score}`,12,32);
}

/* ---------- Logic ---------- */
function updateBird(){
    if(over) return;
    bird.vy += bird.gravity; bird.y += bird.vy;
    if(bird.y+bird.h > GAME_H-GROUND_H){
        bird.y = GAME_H-GROUND_H-bird.h; bird.vy=0;
        if(!over){ over=true; play('hit'); setTimeout(()=>play('die'),200); }
    }
    if(bird.y<0) bird.y=0;
}
function spawnPipe(){
    if(frame%90!==0 || over) return;
    const min=60, max=GAME_H-GROUND_H-PIPE_GAP-min;
    const top = Math.random()*(max-min)+min;
    pipes.push({x:GAME_W, top:top, scored:false});
}
function updatePipes(){
    pipes = pipes.filter(p=>{
        p.x -= 2;
        if(p.x+PIPE_W<bird.x && !p.scored){ score++; p.scored=true; play('score'); }
        if(bird.x+bird.w>p.x && bird.x<p.x+PIPE_W &&
           (bird.y<p.top || bird.y+bird.h>p.top+PIPE_GAP)){
            if(!over){ over=true; play('hit'); setTimeout(()=>play('die'),200); }
        }
        return p.x+PIPE_W>0;
    });
}
function flap(){
    if(!over){ bird.vy=bird.lift; play('flap'); }
    else reset();
}
function reset(){
    bird.y=150; bird.vy=0; pipes=[]; score=0; frame=0; over=false;
    startBGM();
}

/* ---------- Touch Ripple ---------- */
function ripple(e){
    const r = canvas.getBoundingClientRect();
    const x = (e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const y = (e.touches?e.touches[0].clientY:e.clientY)-r.top;
    const el=document.createElement('div'); el.className='ripple';
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=el.style.height='40px';
    canvas.parentNode.appendChild(el);
    setTimeout(()=>el.remove(),600);
}

/* ---------- Input ---------- */
function handle(e){ e.preventDefault(); ripple(e); flap(); }
canvas.addEventListener('touchstart',handle,{passive:false});
canvas.addEventListener('mousedown',handle);
document.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); flap(); }});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- Game Loop ---------- */
function loop(){
    ctx.clearRect(0,0,GAME_W,GAME_H);
    drawBg(); updateBird(); spawnPipe(); updatePipes(); drawPipes(); drawBird(); drawScore();

    if(over){
        ctx.font='30px Arial'; ctx.strokeStyle='#000'; ctx.lineWidth=4;
        ctx.strokeText('GAME OVER',GAME_W/2-85,GAME_H/2);
        ctx.fillStyle='#fff'; ctx.fillText('GAME OVER',GAME_W/2-85,GAME_H/2);
        ctx.font='18px Arial';
        ctx.strokeText('Tap to Restart',GAME_W/2-70,GAME_H/2+40);
        ctx.fillText('Tap to Restart',GAME_W/2-70,GAME_H/2+40);
    }

    frame++; requestAnimationFrame(loop);
}

/* ---------- Start when assets are ready ---------- */
let loaded = 0, total = 4; // bird, bg, pipeTop, pipeBottom
function assetLoaded(){ if(++loaded===total){ startBGM(); loop(); }}
Object.values(img).forEach(i=>i.onload=assetLoaded);
Object.values(img).forEach(i=>i.onerror=()=>{ i.src='https://via.placeholder.com/50/FF6B6B/FFFFFF?text=ERR'; });
</script>
</body>
</html>
