<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ultra Note — Single File</title>
<style>
  :root{
    --bg:#0f1720;
    --panel:#0b1220;
    --muted:#9aa4b2;
    --accent:#6ee7b7;
    --accent-2:#7dd3fc;
    --card:#0e1b2a;
    --danger:#ff6b6b;
    --glass: rgba(255,255,255,0.03);
    --radius:12px;
    --shadow: 0 6px 18px rgba(2,6,23,0.6);
    color-scheme: dark;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  html,body{height:100%; margin:0; background:linear-gradient(180deg,var(--bg),#071124); color:#e6eef6;}
  *{box-sizing:border-box}
  .app{
    display:grid;
    grid-template-columns: 320px 1fr;
    gap:18px;
    padding:18px;
    height:100vh;
  }

  /* Sidebar */
  .sidebar{
    background:linear-gradient(180deg,var(--panel), rgba(5,9,14,0.6));
    border-radius:var(--radius);
    padding:14px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:12px;
    min-width:260px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .logo{
    width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#042026; font-size:18px;
  }
  h1{font-size:18px;margin:0}
  .controls{display:flex;gap:8px;align-items:center}
  .btn{
    background:var(--glass);border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:10px;cursor:pointer;
    color:var(--muted);font-weight:600;font-size:13px;
  }
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#032024; border:0}
  .search{
    display:flex; gap:8px; align-items:center; background:rgba(255,255,255,0.02); padding:8px;border-radius:10px;
  }
  .search input{flex:1;background:transparent;border:0;color:inherit;outline:none;font-size:13px}
  .meta{display:flex;gap:8px;flex-wrap:wrap}
  .tag{padding:6px 8px;border-radius:999px;background:rgba(255,255,255,0.02);font-size:12px;color:var(--muted);cursor:pointer}
  .tag.active{background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:#042026}

  .note-list{overflow:auto;padding-right:6px;display:flex;flex-direction:column;gap:8px}
  .note-item{
    display:flex;gap:10px;padding:10px;border-radius:10px;background:linear-gradient(180deg,#07142610,transparent);
    cursor:pointer;align-items:flex-start;border:1px solid rgba(255,255,255,0.02);
  }
  .note-item .left{flex:1}
  .note-title{font-weight:700;margin:0 0 6px 0}
  .note-snippet{color:var(--muted);font-size:13px;margin:0}
  .note-meta{display:flex;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);align-items:center}
  .pin{font-size:13px;color:var(--accent); margin-left:auto}

  /* Editor */
  .editor{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:12px;
    height:100%;
  }
  .editor-top{display:flex;gap:12px;align-items:center}
  .title{flex:1;background:transparent;border:0;color:inherit;outline:none;font-size:20px;font-weight:700}
  .small{font-size:13px;color:var(--muted)}
  .toolbar{display:flex;gap:8px}
  .editor-body{display:grid;grid-template-columns:1fr 360px;gap:12px;flex:1;min-height:0}
  .pane{background:rgba(255,255,255,0.02);border-radius:10px;padding:10px;overflow:auto;height:100%}
  textarea{width:100%;height:100%;min-height:320px;background:transparent;border:0;color:inherit;outline:none;resize:none;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;font-size:14px}
  .preview{padding:8px}
  .muted{color:var(--muted)}
  .note-tags{display:flex;gap:8px;flex-wrap:wrap}

  /* small utilities */
  .row{display:flex;gap:8px;align-items:center}
  .danger{color:var(--danger)}
  .file{display:none}
  footer{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding-top:6px}
  .empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:15px}
  @media (max-width:900px){
    .app{grid-template-columns: 1fr; grid-auto-rows: auto 1fr; padding:12px;}
    .editor-body{grid-template-columns:1fr;grid-auto-rows:auto 360px}
    .sidebar{order:2}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">UN</div>
      <div>
        <h1>Ultra Note</h1>
        <div class="muted" style="font-size:12px">Fast local notes — no servers</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="newBtn" title="New note (Ctrl/Cmd+N)">+ New</button>
      <button class="btn" id="exportBtn" title="Export all notes">Export</button>
      <label class="btn" for="importFile" title="Import notes (merge)">
        Import
        <input id="importFile" type="file" accept="application/json" class="file">
      </label>
      <button class="btn" id="clearAll" title="Delete all notes" style="margin-left:auto">Clear</button>
    </div>

    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="opacity:.7"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"/></svg>
      <input placeholder="Search notes or tags (Ctrl/Cmd+F)" id="searchInput" />
      <button class="btn" id="sortBtn" title="Toggle sort">Sort: New</button>
    </div>

    <div class="meta">
      <div class="tag" data-tag="__all" id="tagAll">All</div>
      <div class="tag" data-tag="__pinned" id="tagPinned">Pinned</div>
      <!-- dynamic tags appended here -->
      <div id="tagContainer"></div>
    </div>

    <div class="note-list" id="noteList" aria-live="polite">
      <!-- notes rendered here -->
    </div>

    <footer>
      <div class="muted">LocalStorage • JSON</div>
      <div class="muted" id="count">0 notes</div>
    </footer>
  </aside>

  <main class="editor">
    <div class="editor-top">
      <input class="title" id="noteTitle" placeholder="Untitled note" />
      <div class="toolbar row">
        <button class="btn" id="pinBtn" title="Toggle pin">Pin</button>
        <button class="btn" id="previewToggle">Preview</button>
        <button class="btn" id="deleteBtn">Delete</button>
      </div>
    </div>

    <div class="editor-body">
      <div class="pane">
        <textarea id="noteBody" placeholder="Write notes. Markdown supported (basic)."></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <input id="tagInput" placeholder="Add tags, comma separated" style="background:transparent;border:1px solid rgba(255,255,255,0.03);padding:8px;border-radius:8px;color:inherit;flex:1">
          <button class="btn" id="applyTags">Apply</button>
        </div>
      </div>
      <div class="pane">
        <div class="muted" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div>Preview & Info</div>
          <div class="muted" style="font-size:12px" id="metaTimes">—</div>
        </div>
        <div id="preview" class="preview empty">No note selected</div>
        <div style="margin-top:8px" class="note-tags" id="liveTags"></div>
      </div>
    </div>
  </main>
</div>

<script>
/* Ultra Note — single-file app */
(() => {
  // storage key
  const KEY = 'ultra_notes_v1';
  // state
  let notes = []; // array of note objects
  let selectedId = null;
  let sortBy = 'new'; // 'new' or 'alpha'
  const q = (s)=>document.querySelector(s);
  const _id = ()=>Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  // simple markdown -> html (very small subset)
  function mdToHtml(md){
    if(!md) return '<div class="muted">No content</div>';
    let html = md
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      // code blocks lang\n...\n
      .replace(/([\\s\\S]*?)/g, (m,p)=>'<pre><code>'+p.replace(/</g,'&lt;')+'</code></pre>')
      // headings
      .replace(/^### (.*$)/gim, '<h3>$1</h3>')
      .replace(/^## (.*$)/gim, '<h2>$1</h2>')
      .replace(/^# (.*$)/gim, '<h1>$1</h1>')
      // bold/italic/inline code
      .replace(/\\\\(.?)\\\\*/g, '<strong>$1</strong>')
      .replace(/\\(.?)\\*/g, '<em>$1</em>')
      .replace(/([^]+)`/g, '<code>$1</code>')
      // links
      .replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
      // lists
      .replace(/^(\\s*[-+] .+)$/gim, (m)=>'<li>'+m.trim().replace(/^[-+] /,'')+'</li>')
      .replace(/(<li>[\\s\\S]*?<\\/li>)/g, '<ul>$1</ul>')
      // paragraphs
      .replace(/(?:\\r?\\n){2,}/g, '</p><p>')
      .replace(/^(.+?)$/gim, '<p>$1</p>');
    // cleanup: disallow nested multiple paragraphs inside tags
    html = html.replace(/<p><(h1|h2|h3|pre|ul)/g, '<$1').replace(/<\\/ul><\\/p>/g,'</ul>');
    return html;
  }

  // storage helpers
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      notes = raw ? JSON.parse(raw) : [];
    }catch(e){ notes = []; }
  }
  function save(){
    localStorage.setItem(KEY, JSON.stringify(notes));
  }

  // utilities
  function formatDate(ts){
    if(!ts) return '';
    const d = new Date(ts);
    return d.toLocaleString();
  }

  // render notes list
  function renderList(){
    const container = q('#noteList');
    container.innerHTML = '';
    const stext = q('#searchInput').value.trim().toLowerCase();
    const tagActive = [...qAll('.tag')].find(t=>t.classList.contains('active'))?.dataset?.tag || '__all';

    let filtered = notes.filter(n=>{
      // tag filter
      if(tagActive === '__pinned' && !n.pinned) return false;
      if(tagActive !== '_all' && tagActive !== '_pinned'){
        if(!n.tags || !n.tags.includes(tagActive)) return false;
      }
      // search filter
      if(!stext) return true;
      return (n.title||'').toLowerCase().includes(stext) ||
             (n.body||'').toLowerCase().includes(stext) ||
             ((n.tags||[]).join(' ').toLowerCase().includes(stext));
    });

    if(sortBy === 'new') filtered.sort((a,b)=>b.updated - a.updated);
    else filtered.sort((a,b)=>a.title.localeCompare(b.title));

    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty muted';
      empty.textContent = 'No notes found';
      container.appendChild(empty);
      q('#count').textContent = ${notes.length} notes;
      return;
    }

    for(const n of filtered){
      const el = document.createElement('div');
      el.className = 'note-item';
      el.dataset.id = n.id;
      el.innerHTML = `<div class="left">
                        <div class="note-title">${escapeHtml(n.title || 'Untitled')}</div>
                        <div class="note-snippet">${escapeHtml((n.body||'').slice(0,120)).replace(/\\n/g,' ')}</div>
                        <div class="note-meta"><div>${formatDate(n.updated || n.created)}</div></div>
                      </div>
                      <div class="pin">${n.pinned?'📌':''}</div>`;
      el.addEventListener('click', ()=>selectNote(n.id));
      container.appendChild(el);
    }
    q('#count').textContent = ${notes.length} notes;
  }

  // escape helper
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, (m)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

  // select note
  function selectNote(id){
    selectedId = id;
    const n = notes.find(x=>x.id===id);
    if(!n) return;
    q('#noteTitle').value = n.title || '';
    q('#noteBody').value = n.body || '';
    q('#tagInput').value = (n.tags || []).join(', ');
    q('#preview').innerHTML = mdToHtml(n.body || '');
    q('#metaTimes').textContent = Created: ${formatDate(n.created)} • Updated: ${formatDate(n.updated)};
    q('#pinBtn').textContent = n.pinned ? 'Unpin' : 'Pin';
    updateLiveTags(n.tags || []);
    highlightSelectedInList();
  }

  function highlightSelectedInList(){
    qAll('.note-item').forEach(el=>el.classList.toggle('active', el.dataset.id === selectedId));
  }

  function updateLiveTags(tags){
    const t = q('#liveTags'); t.innerHTML = '';
    if(!tags || tags.length===0) return;
    for(const tag of tags){
      const el = document.createElement('div');
      el.className = 'tag';
      el.textContent = tag;
      el.addEventListener('click', ()=>{ activateTag(tag); renderList(); });
      t.appendChild(el);
    }
  }

  // create new note
  function createNote(focus=true){
    const id = _id();
    const now = Date.now();
    const note = { id, title:'', body:'', tags:[], created: now, updated: now, pinned:false };
    notes.push(note);
    save();
    renderTags();
    renderList();
    selectNote(id);
    if(focus){ q('#noteTitle').focus(); }
  }

  // delete note
  function deleteNote(id){
    const idx = notes.findIndex(n=>n.id===id);
    if(idx===-1) return;
    if(!confirm('Delete this note?')) return;
    notes.splice(idx,1);
    save();
    selectedId = null;
    q('#noteTitle').value=''; q('#noteBody').value=''; q('#preview').innerHTML='No note selected';
    renderTags(); renderList();
  }

  // update currently selected note
  function updateCurrent(){
    if(!selectedId) return;
    const n = notes.find(x=>x.id===selectedId);
    if(!n) return;
    n.title = q('#noteTitle').value;
    n.body = q('#noteBody').value;
    n.updated = Date.now();
    // update tags from tag input (do not auto remove existing tags unless applied)
    const tagStr = q('#tagInput').value.trim();
    n.tags = tagStr ? Array.from(new Set(tagStr.split(',').map(s=>s.trim()).filter(Boolean))) : [];
    save(); renderList(); renderTags(); q('#preview').innerHTML = mdToHtml(n.body||'');
    q('#metaTimes').textContent = Created: ${formatDate(n.created)} • Updated: ${formatDate(n.updated)};
  }

  // apply tags from input to current note
  function applyTags(){
    if(!selectedId) return;
    const n = notes.find(x=>x.id===selectedId); if(!n) return;
    const tagStr = q('#tagInput').value.trim();
    n.tags = tagStr ? Array.from(new Set(tagStr.split(',').map(s=>s.trim()).filter(Boolean))) : [];
    n.updated = Date.now();
    save(); renderTags(); renderList(); updateLiveTags(n.tags);
  }

  // render tags (unique across all notes)
  function renderTags(){
    const container = q('#tagContainer'); container.innerHTML = '';
    const tagSet = new Set();
    notes.forEach(n=> (n.tags||[]).forEach(t=>tagSet.add(t)));
    if(tagSet.size===0) return;
    [...tagSet].sort().forEach(tag=>{
      const el = document.createElement('div');
      el.className = 'tag';
      el.textContent = tag;
      el.dataset.tag = tag;
      el.addEventListener('click', ()=>{ activateTag(tag); renderList(); });
      container.appendChild(el);
    });
  }

  // activate tag
  function activateTag(t){
    qAll('.tag').forEach(el=>el.classList.toggle('active', el.dataset.tag === t));
    // if tag is not present as dataset (liveTags tags) also deselect others
    qAll('.tag').forEach(el=>{
      if(!el.dataset.tag && el.textContent === t) el.classList.add('active');
    });
  }

  // helpers for DOM
  function qAll(s){ return Array.from(document.querySelectorAll(s)); }

  // export notes JSON
  function exportNotes(){
    const data = JSON.stringify({ exportedAt: Date.now(), notes }, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ultra-notes-${new Date().toISOString().slice(0,10)}.json;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // import
  function importFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const parsed = JSON.parse(e.target.result);
        const incoming = parsed.notes || parsed;
        if(!Array.isArray(incoming)) throw new Error('Invalid file format');
        // merge: keep existing ids; if id collision, create new id
        const existingIds = new Set(notes.map(n=>n.id));
        for(const n of incoming){
          if(!n.id || existingIds.has(n.id)) n.id = _id();
          existingIds.add(n.id);
          notes.push(n);
        }
        save(); renderTags(); renderList();
        alert('Import complete. Notes merged.');
      }catch(err){
        alert('Import failed: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  // clear all
  function clearAll(){
    if(!confirm('Delete ALL notes permanently?')) return;
    notes = []; save(); q('#noteTitle').value=''; q('#noteBody').value=''; q('#preview').innerHTML='No note selected';
    renderTags(); renderList();
  }

  // keyboard shortcuts
  function handleShortcuts(e){
    const meta = e.ctrlKey || e.metaKey;
    if(meta && e.key.toLowerCase() === 'n'){ e.preventDefault(); createNote(); }
    if(meta && e.key.toLowerCase() === 's'){ e.preventDefault(); updateCurrent(); alert('Saved'); }
    if(meta && e.key.toLowerCase() === 'f'){ e.preventDefault(); q('#searchInput').focus(); }
    if(e.key === 'Escape'){ q('#noteTitle').blur(); q('#noteBody').blur(); }
  }

  // toggle pin
  function togglePin(){
    if(!selectedId) return;
    const n = notes.find(x=>x.id===selectedId); if(!n) return;
    n.pinned = !n.pinned; n.updated = Date.now(); save(); renderList(); q('#pinBtn').textContent = n.pinned ? 'Unpin' : 'Pin';
  }

  // delete current
  function deleteCurrent(){
    if(!selectedId) return alert('No note selected');
    deleteNote(selectedId);
  }

  // sort toggle
  function toggleSort(){
    sortBy = sortBy === 'new' ? 'alpha' : 'new';
    q('#sortBtn').textContent = 'Sort: ' + (sortBy === 'new' ? 'New' : 'A→Z');
    renderList();
  }

  // preview toggle
  function togglePreview(){
    const pr = q('#preview');
    const body = q('#noteBody');
    if(pr.classList.contains('hidden')){
      pr.classList.remove('hidden');
      pr.style.display = '';
    } else {
      // toggle between showing preview and focusing editor — we'll simply update preview from textarea
      updateCurrent();
    }
  }

  // wire up events
  function bind(){
    q('#newBtn').addEventListener('click', ()=>createNote());
    q('#exportBtn').addEventListener('click', ()=>exportNotes());
    q('#importFile').addEventListener('change', (ev)=> importFile(ev.target.files[0]));
    q('#clearAll').addEventListener('click', clearAll);
    q('#searchInput').addEventListener('input', ()=>renderList());
    q('#noteTitle').addEventListener('input', ()=>{ debounce(updateCurrent, 250)(); });
    q('#noteBody').addEventListener('input', ()=>{ debounce(updateCurrent, 300)(); });
    q('#applyTags').addEventListener('click', applyTags);
    q('#pinBtn').addEventListener('click', togglePin);
    q('#deleteBtn').addEventListener('click', deleteCurrent);
    q('#sortBtn').addEventListener('click', toggleSort);
    q('#previewToggle').addEventListener('click', ()=>{ q('#preview').innerHTML = mdToHtml(q('#noteBody').value); });
    q('#noteList').addEventListener('click', (e)=>{ /* handled per item */});
    document.addEventListener('keydown', handleShortcuts);
    q('#tagAll').dataset.tag='_all'; q('#tagAll').addEventListener('click', ()=>{ activateTag('_all'); renderList(); });
    q('#tagPinned').dataset.tag='_pinned'; q('#tagPinned').addEventListener('click', ()=>{ activateTag('_pinned'); renderList(); });
    q('#importFile').addEventListener('click', (e)=>{ e.target.value = null; }); // allow reimport same file
    q('#noteList').addEventListener('dblclick', (ev)=>{ // quick edit: double click to new note
      const el = ev.target.closest('.note-item');
      if(el) { selectNote(el.dataset.id); q('#noteBody').focus(); }
    });
  }

  // debounce helper
  function debounce(fn, wait=200){
    let
